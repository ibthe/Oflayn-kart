name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      refresh_map:
        description: 'Force refresh the Georgia offline map from OSM sources'
        required: false
        type: boolean
        default: false

permissions:
  contents: read


concurrency:
  group: android-ci-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.2
        with:
          packages: 'platform-tools'

      - name: Install Android SDK platform and build tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Install offline DEM build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-rasterio python3-contourpy
          python3 -c "import contourpy, numpy, rasterio; print('Rasterio', rasterio.__version__, 'NumPy', numpy.__version__, 'ContourPy', contourpy.__version__)"

      - name: Verify source manifest is offline
        run: python3 scripts/verify_offline_manifest.py

      - name: Validate map builder configuration
        run: python3 scripts/verify_map_build_config.py

      - name: Test offline POI extractor and progress logging
        run: python3 scripts/test_build_poi_database.py

      - name: Test offline DEM tile selection and encoding
        run: python3 scripts/test_build_dem.py

      - name: Test offline elevation contour generation
        run: python3 scripts/test_build_contours.py

      - name: Test offline road graph builder and reference router
        run: python3 scripts/test_build_road_graph.py

      - name: Test verified OSM PBF cache and retry behavior
        run: python3 scripts/test_prepare_georgia_pbf.py

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace --console=plain :app:testDebugUnitTest

      # Restore a previously generated map before map building. The source PBF has its own
      # cache and is saved before map generation, so retries do not re-download it.
      - name: Restore most recent generated Georgia map
        id: georgia-map-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            app/src/main/assets/offline/georgia.map
            app/src/main/assets/offline/georgia-poi.sqlite
            app/src/main/assets/offline/georgia-map-build.json
          key: mapsforge-georgia-v0.25.0-poi-v3-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            mapsforge-georgia-v0.25.0-poi-v3-${{ runner.os }}-
            mapsforge-georgia-v0.25.0-poi-v3-

      - name: Validate restored map cache
        id: map-state
        run: |
          if [[ -s app/src/main/assets/offline/georgia.map && -s app/src/main/assets/offline/georgia-poi.sqlite && -s app/src/main/assets/offline/georgia-map-build.json ]] && python3 scripts/verify_bundled_map.py; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "A verified cached Georgia map is available."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            rm -f app/src/main/assets/offline/georgia.map app/src/main/assets/offline/georgia-poi.sqlite app/src/main/assets/offline/georgia-map-build.json
            echo "No valid cached Georgia map is available; a fresh map will be generated."
          fi

      # Cache the 98 MB source extract independently of the final map.
      # This cache is saved immediately after checksum verification, before POI
      # extraction / map writing, so a canceled run does not repeat the download.
      - name: Restore verified Georgia OSM PBF
        id: pbf-cache
        if: ${{ steps.map-state.outputs.exists != 'true' && github.event_name != 'schedule' && inputs.refresh_map != true }}
        uses: actions/cache/restore@v4
        with:
          path: |
            data/cache/georgia-latest.osm.pbf
            data/cache/georgia-source.json
          key: georgia-osm-pbf-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            georgia-osm-pbf-v1-${{ runner.os }}-

      - name: Prepare and checksum-verify Georgia OSM PBF
        id: prepare-pbf
        if: ${{ steps.map-state.outputs.exists != 'true' || github.event_name == 'schedule' || inputs.refresh_map == true }}
        env:
          FORCE_OSM_REFRESH: ${{ github.event_name == 'schedule' || inputs.refresh_map == true }}
        run: bash scripts/prepare_georgia_pbf.sh

      - name: Save verified Georgia OSM PBF cache
        if: ${{ success() && steps.prepare-pbf.outputs.pbf-downloaded == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            data/cache/georgia-latest.osm.pbf
            data/cache/georgia-source.json
          key: georgia-osm-pbf-v1-${{ runner.os }}-${{ steps.prepare-pbf.outputs.source-md5 }}

      - name: Install Osmosis
        if: ${{ success() && (steps.map-state.outputs.exists != 'true' || github.event_name == 'schedule' || inputs.refresh_map == true) }}
        shell: bash
        run: |
          sudo apt-get update
          apt-cache policy python3-pyosmium
          sudo apt-get install --yes osmosis python3-pyosmium
          python3 -c "import osmium; print('PyOsmium import OK')"
          python3 scripts/test_poi_extractor_smoke.py
          osmosis_package_version="$(dpkg-query -W -f='${Version}' osmosis)"
          pyosmium_package_version="$(dpkg-query -W -f='${Version}' python3-pyosmium)"
          if [[ -z "$osmosis_package_version" || -z "$pyosmium_package_version" ]]; then
            echo "Could not determine the installed Osmosis or PyOsmium package version." >&2
            exit 1
          fi
          echo "Installed Osmosis Debian package: ${osmosis_package_version}"
          echo "Installed PyOsmium Debian package: ${pyosmium_package_version}"

      - name: Restore most recent offline road graph
        uses: actions/cache/restore@v4
        with:
          path: app/src/main/assets/offline/georgia-roads.bin
          key: georgia-roads-v4-${{ runner.os }}-restore-only
          restore-keys: |
            georgia-roads-v4-${{ runner.os }}-

      - name: Check restored road graph
        id: roads-state
        shell: bash
        run: |
          roads=app/src/main/assets/offline/georgia-roads.bin
          if [[ -s "$roads" && "$(head -c 4 "$roads")" == "GRT1" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Restored road graph: $(stat -c %s "$roads") bytes"
          else
            rm -f "$roads"
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No usable road graph in cache."
          fi

      # The road graph is optional: if it cannot be built, the map and APK are still produced and
      # the app reports routes as unavailable. A previously cached graph is kept on failure.
      # Failure is handled inside the script (not by hiding it with a workflow-level override).
      - name: Generate offline road graph (optional)
        id: generate-roads
        if: ${{ steps.roads-state.outputs.exists != 'true' || github.event_name == 'schedule' || inputs.refresh_map == true }}
        shell: bash
        run: |
          # `set -e` is ignored inside a command tested by `if`, so every step reports failure explicitly.
          build_roads() {
            if ! python3 -c "import osmium" 2>/dev/null; then
              sudo apt-get update || return 1
              sudo apt-get install --yes python3-pyosmium || return 1
            fi
            if [[ ! -s data/cache/georgia-latest.osm.pbf ]]; then
              bash scripts/prepare_georgia_pbf.sh || return 1
            fi
            local out="${RUNNER_TEMP}/georgia-roads.bin"
            python3 scripts/build_road_graph.py data/cache/georgia-latest.osm.pbf "$out" --summary "${RUNNER_TEMP}/georgia-roads-summary.json" || return 1
            python3 scripts/verify_road_graph.py "$out" || return 1
            mkdir -p app/src/main/assets/offline || return 1
            mv "$out" app/src/main/assets/offline/georgia-roads.bin || return 1
            cat "${RUNNER_TEMP}/georgia-roads-summary.json" || true
          }
          if ( build_roads ); then
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "generated=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The offline road graph could not be generated. The APK is built without a new graph and the app will report routes as unavailable if none was cached."
          fi

      - name: Cache generated road graph
        if: ${{ steps.generate-roads.outputs.generated == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: app/src/main/assets/offline/georgia-roads.bin
          key: georgia-roads-v4-${{ runner.os }}-${{ github.run_id }}

      - name: Build Mapsforge map-writer plugin
        if: ${{ success() && (steps.map-state.outputs.exists != 'true' || github.event_name == 'schedule' || inputs.refresh_map == true) }}
        run: bash scripts/install_mapsforge_writer.sh

      - name: Generate multilingual offline map of Georgia
        id: generate-map
        if: ${{ steps.map-state.outputs.exists != 'true' || github.event_name == 'schedule' || inputs.refresh_map == true }}
        shell: bash
        run: |
          if bash scripts/build_georgia_map.sh; then
            echo "map-refreshed=true" >> "$GITHUB_OUTPUT"
          else
            build_status=$?
            if [[ -s app/src/main/assets/offline/georgia.map && -s app/src/main/assets/offline/georgia-poi.sqlite && -s app/src/main/assets/offline/georgia-map-build.json ]]; then
              echo "::warning::Map refresh failed (exit ${build_status}); keeping the previously cached verified map."
              echo "map-refreshed=false" >> "$GITHUB_OUTPUT"
            else
              echo "ERROR: Map generation failed and no previously verified map is available." >&2
              exit "$build_status"
            fi
          fi

      - name: Cache generated Georgia map
        if: ${{ success() && steps.generate-map.outputs.map-refreshed == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            app/src/main/assets/offline/georgia.map
            app/src/main/assets/offline/georgia-poi.sqlite
            app/src/main/assets/offline/georgia-map-build.json
          key: mapsforge-georgia-v0.25.0-poi-v3-${{ runner.os }}-${{ steps.generate-map.outputs.provider }}-${{ steps.generate-map.outputs.source-md5 }}-${{ github.run_id }}

      - name: Verify generated country map and multilingual metadata
        run: python3 scripts/verify_bundled_map.py

      - name: Restore or cache Georgia Copernicus DEM tiles
        id: georgia_dem_cache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/dem
          key: georgia-dem-glo90-v1-${{ runner.os }}-${{ hashFiles('scripts/build_dem.py') }}

      - name: Build Georgia Copernicus GLO-90 elevation tiles
        if: ${{ steps.georgia_dem_cache.outputs['cache-hit'] != 'true' }}
        run: python3 scripts/build_dem.py --output app/src/main/assets/dem

      - name: Verify Georgia DEM package
        run: python3 scripts/verify_dem.py app/src/main/assets/dem

      - name: Restore or cache Georgia elevation contour map
        id: contours_cache
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/offline/georgia-contours.map
            app/src/main/assets/offline/georgia-contours-manifest.json
          key: georgia-contours-v1-${{ runner.os }}-${{ hashFiles('scripts/build_contours.py', 'scripts/build_contours_map.sh', 'scripts/verify_contours_map.py', 'scripts/install_mapsforge_writer.sh', 'scripts/build_georgia_map.sh') }}-${{ hashFiles('app/src/main/assets/dem/manifest.json') }}

      - name: Build Mapsforge map-writer plugin for contour layer
        if: ${{ success() && steps.contours_cache.outputs['cache-hit'] != 'true' && steps.map-state.outputs.exists == 'true' }}
        run: bash scripts/install_mapsforge_writer.sh

      - name: Generate elevation contour geometry
        if: ${{ steps.contours_cache.outputs['cache-hit'] != 'true' }}
        run: |
          python3 scripts/build_contours.py \
            --dem-dir app/src/main/assets/dem \
            --output-osm build/georgia-contours.osm \
            --manifest build/georgia-contours-manifest.json

      - name: Build separate Mapsforge contour map
        if: ${{ steps.contours_cache.outputs['cache-hit'] != 'true' }}
        run: |
          bash scripts/build_contours_map.sh \
            build/georgia-contours.osm \
            app/src/main/assets/offline/georgia-contours.map \
            build/georgia-contours-manifest.json \
            app/src/main/assets/offline/georgia-contours-manifest.json

      - name: Save generated contour map cache
        if: ${{ success() && steps.contours_cache.outputs['cache-hit'] != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            app/src/main/assets/offline/georgia-contours.map
            app/src/main/assets/offline/georgia-contours-manifest.json
          key: georgia-contours-v1-${{ runner.os }}-${{ hashFiles('scripts/build_contours.py', 'scripts/build_contours_map.sh', 'scripts/verify_contours_map.py', 'scripts/install_mapsforge_writer.sh', 'scripts/build_georgia_map.sh') }}-${{ hashFiles('app/src/main/assets/dem/manifest.json') }}

      - name: Verify offline contour map
        run: |
          python3 scripts/verify_contours_map.py \
            --map app/src/main/assets/offline/georgia-contours.map \
            --existing-manifest app/src/main/assets/offline/georgia-contours-manifest.json

      - name: Assemble debug APK with the complete offline map
        run: gradle --no-daemon --stacktrace --console=plain :app:assembleDebug

      - name: Inspect packaged DEM asset paths
        run: |
          python3 - <<'PY'
          import glob, zipfile
          apk = glob.glob("app/build/outputs/apk/debug/*.apk")[0]
          with zipfile.ZipFile(apk) as archive:
              entries = sorted(name for name in archive.namelist() if name.startswith("assets/dem/"))
          print("APK DEM entries:", len(entries))
          for name in entries[:40]:
              print(name)
          PY
          find app/build -path "*/merged_assets/*/out/dem/*" -type f | head -40 || true

      - name: Verify the APK contains the full offline map
        run: python3 scripts/verify_apk_bundle.py

      - name: Verify merged manifest remains offline
        run: python3 scripts/verify_offline_manifest.py --include-merged

      - name: Assemble Android UI regression tests
        run: gradle --no-daemon --stacktrace --console=plain :app:assembleDebugAndroidTest

      - name: Upload APKs for emulator validation
        uses: actions/upload-artifact@v4
        with:
          name: GeorgiaOffline-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 14

