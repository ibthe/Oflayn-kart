name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.2
        with:
          # The old `tools` package was removed from Google's SDK repository.
          # setup-android v4.0.2 no longer requests it; platform-tools is sufficient here.
          packages: 'platform-tools'

      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Verify offline manifest
        run: python3 scripts/verify_offline_manifest.py

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace --console=plain :app:testDebugUnitTest

      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace --console=plain :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeorgiaOffline-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
